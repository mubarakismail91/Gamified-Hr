name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (unit + API)
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the API tests; it only lives for this job.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: iu_hr_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: iu_hr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iu_hr_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://iu_hr_user:ci_password@localhost:5432/iu_hr_test
      DATABASE_URL: postgresql://iu_hr_user:ci_password@localhost:5432/iu_hr_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Unit tests
        run: npm test
      - name: API tests (migrates the test database first)
        run: npm run test:e2e

  frontend:
    name: Frontend (typecheck + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
